<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>桜が出てくる歌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #faf8f7;
      --surface: #ffffff;
      --surface-soft: #fdf9fa;

      --text: #302a2c;
      --text-sub: #7f7376;

      --pink: #c9798c;
      --pink-dark: #a9566b;
      --pink-soft: #f6e7eb;

      --border: #eadfe1;

      --shadow:
        0 12px 40px rgba(74, 48, 55, 0.07);
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(224, 175, 187, 0.17),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(237, 205, 212, 0.18),
          transparent 28%
        ),
        var(--background);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;

      padding: 70px 0 42px;

      position: relative;
    }

    .header-small {
      margin-bottom: 10px;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;

      color: var(--pink-dark);
    }

    h1 {
      margin: 0;

      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        serif;

      font-size: clamp(35px, 6vw, 58px);
      font-weight: 500;

      letter-spacing: 0.06em;
    }

    .description {
      margin: 16px 0 0;

      font-size: 15px;
      line-height: 1.9;

      color: var(--text-sub);
    }

    .header-petal {
      position: absolute;
      top: 42px;
      right: 30px;

      width: 80px;
      height: 80px;

      color: var(--pink);
      opacity: 0.14;

      transform: rotate(18deg);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;

      padding-bottom: 80px;
    }

    /* =========================
       INPUT CARD
    ========================= */

    .input-card {
      padding: 28px;

      background: rgba(255, 255, 255, 0.88);

      border: 1px solid var(--border);
      border-radius: 24px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .input-heading {
      margin-bottom: 20px;

      font-size: 15px;
      font-weight: 700;
    }

    /* =========================
       THEME SELECTOR
    ========================= */

    .theme-selector {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;

      margin-bottom: 24px;
    }

    .theme-option input {
      position: absolute;

      opacity: 0;
      pointer-events: none;
    }

    .theme-option label {
      height: 82px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 13px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: var(--surface);

      cursor: pointer;

      transition:
        border-color 0.2s,
        background 0.2s,
        transform 0.2s,
        box-shadow 0.2s;
    }

    .theme-option label:hover {
      transform: translateY(-2px);

      border-color: #dab4bd;

      box-shadow:
        0 7px 22px rgba(90, 55, 63, 0.06);
    }

    .theme-option input:checked + label {
      border-color: var(--pink);

      background: var(--pink-soft);

      box-shadow:
        inset 0 0 0 1px
        rgba(201, 121, 140, 0.15);
    }

    .theme-icon {
      width: 31px;
      height: 31px;

      color: var(--pink);
    }

    .theme-text {
      display: flex;
      flex-direction: column;
    }

    .theme-main {
      font-size: 17px;
      font-weight: 700;
    }

    .theme-sub {
      margin-top: 2px;

      font-size: 11px;

      color: var(--text-sub);
    }

    /* =========================
       FORM
    ========================= */

    .form-grid {
      display: grid;

      grid-template-columns:
        1.2fr
        1.2fr
        0.55fr
        0.9fr
        auto;

      gap: 12px;

      align-items: end;
    }

    .field label {
      display: block;

      margin: 0 0 7px 2px;

      font-size: 11px;
      font-weight: 700;

      color: var(--text-sub);
    }

    .field input,
    .field select {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid var(--border);
      border-radius: 12px;

      outline: none;

      background: #fff;

      color: var(--text);

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--pink);

      box-shadow:
        0 0 0 3px
        rgba(201, 121, 140, 0.12);
    }

    .submit-button {
      height: 48px;

      padding: 0 25px;

      border: 0;
      border-radius: 12px;

      background: var(--pink-dark);

      color: #fff;

      font-weight: 700;

      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    .submit-button:hover {
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      cursor: default;

      opacity: 0.55;

      transform: none;
    }

    .notice {
      display: none;

      margin-top: 16px;
      padding: 11px 14px;

      border-radius: 10px;

      background: #f3f7f3;

      color: #667b68;

      font-size: 13px;
    }

    /* =========================
       SONG AREA
    ========================= */

    .song-area {
      margin-top: 48px;
    }

    .song-area-title {
      margin-bottom: 20px;

      display: flex;
      align-items: baseline;
      justify-content: space-between;

      gap: 16px;
    }

    .song-area-title h2 {
      margin: 0;

      font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        serif;

      font-size: 22px;
      font-weight: 500;
    }

    .realtime {
      display: flex;
      align-items: center;

      gap: 7px;

      font-size: 11px;

      color: var(--text-sub);
    }

    .realtime-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #74a47b;

      box-shadow:
        0 0 0 3px
        rgba(116, 164, 123, 0.12);
    }

    .columns {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 20px;

      align-items: start;
    }

    .column {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 20px;

      background:
        rgba(255, 255, 255, 0.75);

      box-shadow:
        0 7px 28px
        rgba(74, 48, 55, 0.045);
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      padding: 20px 20px 17px;

      border-bottom: 1px solid var(--border);
    }

    .column-heading {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .column-heading svg {
      width: 25px;
      height: 25px;

      color: var(--pink);
    }

    .column-heading h3 {
      margin: 0;

      font-size: 16px;
      font-weight: 700;
    }

    .count {
      padding: 4px 9px;

      border-radius: 30px;

      background: var(--pink-soft);

      color: var(--pink-dark);

      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       SONG CARDS
    ========================= */

    .song-list {
      min-height: 150px;

      padding: 12px;
    }

    .song-card {
      position: relative;

      margin-bottom: 9px;

      padding: 16px 44px 15px 16px;

      border: 1px solid #efe5e7;
      border-radius: 13px;

      background: rgba(255, 255, 255, 0.95);

      animation:
        cardAppear 0.25s ease;
    }

    .song-card:last-child {
      margin-bottom: 0;
    }

    @keyframes cardAppear {

      from {
        opacity: 0;

        transform:
          translateY(5px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    .song-title {
      margin-bottom: 5px;

      font-size: 16px;
      font-weight: 700;

      overflow-wrap: anywhere;
    }

    .song-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .artist {
      min-width: 0;

      font-size: 13px;

      color: var(--text-sub);

      overflow-wrap: anywhere;
    }

    .student {
      flex-shrink: 0;

      padding: 3px 8px;

      border-radius: 20px;

      background: #faf0f2;

      color: #986472;

      font-size: 11px;
    }

    /* X button */

    .delete-button {
      position: absolute;

      top: 11px;
      right: 11px;

      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: transparent;

      color: #a89da0;

      font-size: 22px;
      font-weight: 300;
      line-height: 1;

      transition:
        background 0.15s,
        color 0.15s;
    }

    .delete-button:hover {
      background: #f7e9ec;

      color: var(--pink-dark);
    }

    .empty {
      padding: 43px 20px;

      text-align: center;

      color: #aaa0a2;

      font-size: 12px;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      display: none;

      margin-top: 16px;
      padding: 12px 14px;

      border-radius: 10px;

      background: #fff0f0;

      color: #a04c4c;

      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================
       DELETE MODAL
    ========================= */

    .modal-background {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(35, 27, 30, 0.34);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal-background.show {
      display: flex;
    }

    .modal {
      width: min(370px, 100%);

      padding: 27px;

      border-radius: 20px;

      background: #fff;

      box-shadow:
        0 20px 60px
        rgba(45, 30, 35, 0.2);

      animation:
        modalAppear 0.18s ease;
    }

    @keyframes modalAppear {

      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal h3 {
      margin: 0 0 8px;

      font-size: 18px;
    }

    .modal p {
      margin: 0;

      color: var(--text-sub);

      font-size: 13px;
      line-height: 1.7;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;

      gap: 9px;

      margin-top: 24px;
    }

    .modal-button {
      height: 41px;

      padding: 0 17px;

      border-radius: 10px;

      font-size: 13px;
      font-weight: 700;
    }

    .cancel-button {
      border: 1px solid var(--border);

      background: #fff;

      color: var(--text);
    }

    .confirm-delete-button {
      border: 0;

      background: var(--pink-dark);

      color: #fff;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 48px;

      text-align: center;

      color: #ada2a4;

      font-size: 10px;
      letter-spacing: 0.08em;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 820px) {

      header {
        padding-top: 48px;
      }

      .header-petal {
        width: 58px;
        height: 58px;

        right: 4px;
      }

      .input-card {
        padding: 20px;
      }

      .form-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .artist-field,
      .song-field {
        grid-column: span 2;
      }

      .submit-button {
        grid-column: span 2;

        width: 100%;
      }

      .columns {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {

      header {
        width:
          min(100% - 28px, 1080px);
      }

      main {
        width:
          min(100% - 20px, 1080px);
      }

      .theme-selector {
        gap: 8px;
      }

      .theme-option label {
        height: 88px;

        padding: 10px;

        gap: 8px;
      }

      .theme-icon {
        width: 26px;
        height: 26px;
      }

      .theme-main {
        font-size: 14px;
      }

      .theme-sub {
        font-size: 9px;
      }

      .song-area-title {
        align-items: center;
      }
    }

  </style>
</head>


<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="header-small">
      言語文化　和歌「桜花散りぬる風の～」
    </div>

    <h1>
      桜が出てくる歌
    </h1>

    <p class="description">
      「咲く」か「散る」か、
      歌詞のテーマになっている（歌詞に出てくる）曲を登録してください。
    </p>


    <!-- 舞う桜の花びら -->
    <svg
      class="header-petal"
      viewBox="0 0 60 60"
      aria-hidden="true"
    >

      <path
        fill="currentColor"
        d="
          M17 8
          C31 6 45 17 44 31
          C43 43 33 52 21 51
          C13 50 8 44 8 36
          C8 25 12 15 17 8
          Z
        "
      />

    </svg>

  </header>


  <main>

    <!-- =========================
         INPUT
    ========================== -->

    <section class="input-card">

      <div class="input-heading">
        「咲く」「散る」どちらか選択
      </div>


      <!-- 2択 -->

      <div class="theme-selector">

        <!-- 咲く -->

        <div class="theme-option">

          <input
            type="radio"
            name="theme"
            id="themeBloom"
            value="bloom"
            checked
          >

          <label for="themeBloom">

            <!-- 桜の花 -->
            <svg
              class="theme-icon"
              viewBox="0 0 60 60"
              aria-hidden="true"
            >

              <g fill="currentColor">

                <ellipse
                  cx="30"
                  cy="15"
                  rx="8"
                  ry="13"
                />

                <ellipse
                  cx="44"
                  cy="26"
                  rx="8"
                  ry="13"
                  transform="rotate(72 44 26)"
                />

                <ellipse
                  cx="39"
                  cy="43"
                  rx="8"
                  ry="13"
                  transform="rotate(144 39 43)"
                />

                <ellipse
                  cx="21"
                  cy="43"
                  rx="8"
                  ry="13"
                  transform="rotate(216 21 43)"
                />

                <ellipse
                  cx="16"
                  cy="26"
                  rx="8"
                  ry="13"
                  transform="rotate(288 16 26)"
                />

              </g>

              <circle
                cx="30"
                cy="30"
                r="4"
                fill="#d8ac77"
              />

            </svg>


            <span class="theme-text">

              <span class="theme-main">
                咲く
              </span>

              <span class="theme-sub">
                咲くことに関する歌
              </span>

            </span>

          </label>

        </div>


        <!-- 散る -->

        <div class="theme-option">

          <input
            type="radio"
            name="theme"
            id="themeFall"
            value="fall"
          >

          <label for="themeFall">

            <!-- 同じ桜から散った1枚の花びら -->
            <svg
              class="theme-icon"
              viewBox="0 0 60 60"
              aria-hidden="true"
            >

              <path
                fill="currentColor"
                d="
                  M19 8
                  C33 5 46 17 44 31
                  C42 44 31 52 19 49
                  C11 47 7 40 9 32
                  C11 21 15 13 19 8
                  Z
                "
                transform="rotate(28 30 30)"
              />

              <path
                d="
                  M42 12
                  C48 16 51 21 53 27
                "
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                opacity="0.32"
              />

            </svg>


            <span class="theme-text">

              <span class="theme-main">
                散る
              </span>

              <span class="theme-sub">
                散ることに関する歌
              </span>

            </span>

          </label>

        </div>

      </div>


      <!-- INPUT FIELDS -->

      <div class="form-grid">

        <div class="field artist-field">

          <label for="artist">
            アーティスト
          </label>

          <input
            id="artist"
            type="text"
            maxlength="100"
            autocomplete="off"
            placeholder="例：いきものがかり"
          >

        </div>


        <div class="field song-field">

          <label for="title">
            曲名
          </label>

          <input
            id="title"
            type="text"
            maxlength="100"
            autocomplete="off"
            placeholder="例：SAKURA"
          >

        </div>


        <div class="field">

          <label for="className">
            クラス
          </label>

          <select id="className">

            <option value="">
              空白
            </option>

            <option value="A">
              A
            </option>

            <option value="B">
              B
            </option>

          </select>

        </div>


        <div class="field">

          <label for="studentName">
            名前
          </label>

          <input
            id="studentName"
            type="text"
            maxlength="50"
            autocomplete="off"
            placeholder="田中"
          >

        </div>


        <button
          id="submitButton"
          class="submit-button"
          type="button"
        >
          登録
        </button>

      </div>


      <div
        id="notice"
        class="notice"
      >
        登録しました。
      </div>


      <div
        id="errorBox"
        class="error-box"
      >
      </div>

    </section>


    <!-- =========================
         RESULT
    ========================== -->

    <section class="song-area">

      <div class="song-area-title">

        <h2>
          登録された歌
        </h2>

        <div class="realtime">

          <span class="realtime-dot"></span>

          リアルタイム更新

        </div>

      </div>


      <div class="columns">

        <!-- 咲く -->

        <section class="column">

          <div class="column-header">

            <div class="column-heading">

              <svg
                viewBox="0 0 60 60"
                aria-hidden="true"
              >

                <g fill="currentColor">

                  <ellipse
                    cx="30"
                    cy="15"
                    rx="8"
                    ry="13"
                  />

                  <ellipse
                    cx="44"
                    cy="26"
                    rx="8"
                    ry="13"
                    transform="rotate(72 44 26)"
                  />

                  <ellipse
                    cx="39"
                    cy="43"
                    rx="8"
                    ry="13"
                    transform="rotate(144 39 43)"
                  />

                  <ellipse
                    cx="21"
                    cy="43"
                    rx="8"
                    ry="13"
                    transform="rotate(216 21 43)"
                  />

                  <ellipse
                    cx="16"
                    cy="26"
                    rx="8"
                    ry="13"
                    transform="rotate(288 16 26)"
                  />

                </g>

              </svg>

              <h3>
                咲くことに関する歌
              </h3>

            </div>

            <span
              id="bloomCount"
              class="count"
            >
              0曲
            </span>

          </div>


          <div
            id="bloomList"
            class="song-list"
          >
          </div>

        </section>


        <!-- 散る -->

        <section class="column">

          <div class="column-header">

            <div class="column-heading">

              <svg
                viewBox="0 0 60 60"
                aria-hidden="true"
              >

                <path
                  fill="currentColor"
                  d="
                    M19 8
                    C33 5 46 17 44 31
                    C42 44 31 52 19 49
                    C11 47 7 40 9 32
                    C11 21 15 13 19 8
                    Z
                  "
                  transform="rotate(28 30 30)"
                />

              </svg>

              <h3>
                散ることに関する歌
              </h3>

            </div>

            <span
              id="fallCount"
              class="count"
            >
              0曲
            </span>

          </div>


          <div
            id="fallList"
            class="song-list"
          >
          </div>

        </section>

      </div>

    </section>


    <footer>
      SAKURA SONGS
    </footer>

  </main>


  <!-- =========================
       DELETE CONFIRM MODAL
  ========================== -->

  <div
    id="deleteModal"
    class="modal-background"
  >

    <div class="modal">

      <h3>
        この投稿を削除しますか？
      </h3>

      <p>
        削除すると、全員の画面からこの投稿が消えます。
      </p>


      <div class="modal-buttons">

        <button
          id="cancelDelete"
          class="modal-button cancel-button"
          type="button"
        >
          キャンセル
        </button>


        <button
          id="confirmDelete"
          class="modal-button confirm-delete-button"
          type="button"
        >
          削除する
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================== -->

  <script type="module">

    /*
    ============================================
    Firebase SDK
    ============================================
    */

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /*
    ============================================
    ★ここをFirebaseの設定に置き換える
    ============================================
    */

   const firebaseConfig = {
  apiKey: "AIzaSyBtMmgeKmA_9xloxM4SKWUgBGH5U_v_Eg0",
  authDomain: "sakura-song.firebaseapp.com",
  projectId: "sakura-song",
  storageBucket: "sakura-song.firebasestorage.app",
  messagingSenderId: "10468799735",
  appId: "1:10468799735:web:e9e8993439ae9a5c290ff2"
};

    /*
    ============================================
    Firebase initialization
    ============================================
    */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);

    const songsCollection =
      collection(db, "songs");


    /*
    ============================================
    DOM
    ============================================
    */

    const artistInput =
      document.getElementById("artist");

    const titleInput =
      document.getElementById("title");

    const classInput =
      document.getElementById("className");

    const studentInput =
      document.getElementById("studentName");

    const submitButton =
      document.getElementById("submitButton");

    const bloomList =
      document.getElementById("bloomList");

    const fallList =
      document.getElementById("fallList");

    const bloomCount =
      document.getElementById("bloomCount");

    const fallCount =
      document.getElementById("fallCount");

    const notice =
      document.getElementById("notice");

    const errorBox =
      document.getElementById("errorBox");

    const deleteModal =
      document.getElementById("deleteModal");

    const cancelDelete =
      document.getElementById("cancelDelete");

    const confirmDelete =
      document.getElementById("confirmDelete");


    /*
    ============================================
    Delete target
    ============================================
    */

    let deleteTargetId = null;


    /*
    ============================================
    Escape / Safe DOM creation
    ============================================
    */

    function createSongCard(song) {

      const card =
        document.createElement("article");

      card.className =
        "song-card";


      /*
      Delete button
      */

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-button";

      deleteButton.type =
        "button";

      deleteButton.textContent =
        "×";

      deleteButton.setAttribute(
        "aria-label",
        "この投稿を削除"
      );


      deleteButton.addEventListener(
        "click",
        () => {

          deleteTargetId =
            song.id;

          deleteModal.classList.add(
            "show"
          );

        }
      );


      /*
      Title
      */

      const songTitle =
        document.createElement("div");

      songTitle.className =
        "song-title";

      songTitle.textContent =
        song.title;


      /*
      Bottom
      */

      const meta =
        document.createElement("div");

      meta.className =
        "song-meta";


      const artist =
        document.createElement("div");

      artist.className =
        "artist";

      artist.textContent =
        song.artist;


      const student =
        document.createElement("div");

      student.className =
        "student";


      if (song.className) {

        student.textContent =
          `${song.className} ${song.name}`;

      } else {

        student.textContent =
          song.name;

      }


      meta.appendChild(artist);
      meta.appendChild(student);

      card.appendChild(deleteButton);
      card.appendChild(songTitle);
      card.appendChild(meta);

      return card;
    }


    /*
    ============================================
    Render
    ============================================
    */

    function renderSongs(songs) {

      bloomList.innerHTML = "";
      fallList.innerHTML = "";


      const bloomSongs =
        songs.filter(
          song =>
            song.type === "bloom"
        );


      const fallSongs =
        songs.filter(
          song =>
            song.type === "fall"
        );


      bloomCount.textContent =
        `${bloomSongs.length}曲`;

      fallCount.textContent =
        `${fallSongs.length}曲`;


      /*
      Bloom
      */

      if (bloomSongs.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty";

        empty.textContent =
          "まだ登録されていません";

        bloomList.appendChild(empty);

      } else {

        bloomSongs.forEach(song => {

          bloomList.appendChild(
            createSongCard(song)
          );

        });

      }


      /*
      Fall
      */

      if (fallSongs.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty";

        empty.textContent =
          "まだ登録されていません";

        fallList.appendChild(empty);

      } else {

        fallSongs.forEach(song => {

          fallList.appendChild(
            createSongCard(song)
          );

        });

      }

    }


    /*
    ============================================
    Real-time listener
    ============================================
    */

    onSnapshot(

      songsCollection,

      snapshot => {

        const songs =
          snapshot.docs.map(
            documentSnapshot => ({

              id:
                documentSnapshot.id,

              ...documentSnapshot.data()

            })
          );


        /*
        新しい投稿順
        */

        songs.sort(
          (a, b) =>
            (b.createdAt || 0) -
            (a.createdAt || 0)
        );


        renderSongs(songs);

        hideError();

      },

      error => {

        console.error(error);

        showError(
          "データを読み込めませんでした。Firebaseの設定とFirestoreのルールを確認してください。"
        );

      }

    );


    /*
    ============================================
    Register
    ============================================
    */

    submitButton.addEventListener(
      "click",
      registerSong
    );


    async function registerSong() {

      const artist =
        artistInput.value.trim();

      const title =
        titleInput.value.trim();

      const className =
        classInput.value;

      const name =
        studentInput.value.trim();

      const selectedTheme =
        document.querySelector(
          'input[name="theme"]:checked'
        ).value;


      /*
      Validation
      */

      if (!artist) {

        artistInput.focus();

        showError(
          "アーティスト名を入力してください。"
        );

        return;
      }


      if (!title) {

        titleInput.focus();

        showError(
          "曲名を入力してください。"
        );

        return;
      }


      if (!name) {

        studentInput.focus();

        showError(
          "名前を入力してください。"
        );

        return;
      }


      submitButton.disabled = true;

      submitButton.textContent =
        "登録中…";


      try {

        await addDoc(
          songsCollection,
          {

            type:
              selectedTheme,

            title:
              title,

            artist:
              artist,

            className:
              className,

            name:
              name,

            createdAt:
              Date.now()

          }
        );


        /*
        Clear song fields.
        クラスと名前は残す。
        同じ生徒が連続投稿しやすいため。
        */

        artistInput.value = "";
        titleInput.value = "";

        titleInput.focus();


        showNotice();

        hideError();

      }

      catch (error) {

        console.error(error);

        showError(
          "登録できませんでした。Firebaseの設定または通信状態を確認してください。"
        );

      }

      finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "登録";

      }

    }


    /*
    ============================================
    Enter
    ============================================
    */

    studentInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          registerSong();

        }

      }
    );


    /*
    ============================================
    Delete modal
    ============================================
    */

    cancelDelete.addEventListener(
      "click",
      closeDeleteModal
    );


    deleteModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          deleteModal
        ) {

          closeDeleteModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          deleteModal.classList.contains(
            "show"
          )
        ) {

          closeDeleteModal();

        }

      }
    );


    function closeDeleteModal() {

      deleteTargetId = null;

      deleteModal.classList.remove(
        "show"
      );

    }


    /*
    ============================================
    Delete
    ============================================
    */

    confirmDelete.addEventListener(
      "click",
      async () => {

        if (!deleteTargetId) {
          return;
        }


        const id =
          deleteTargetId;


        confirmDelete.disabled =
          true;

        confirmDelete.textContent =
          "削除中…";


        try {

          await deleteDoc(
            doc(
              db,
              "songs",
              id
            )
          );


          closeDeleteModal();

          hideError();

        }

        catch (error) {

          console.error(error);

          showError(
            "削除できませんでした。Firebaseの設定または通信状態を確認してください。"
          );

          closeDeleteModal();

        }

        finally {

          confirmDelete.disabled =
            false;

          confirmDelete.textContent =
            "削除する";

        }

      }
    );


    /*
    ============================================
    Notice
    ============================================
    */

    function showNotice() {

      notice.style.display =
        "block";


      clearTimeout(
        showNotice.timer
      );


      showNotice.timer =
        setTimeout(
          () => {

            notice.style.display =
              "none";

          },
          1600
        );

    }


    /*
    ============================================
    Error
    ============================================
    */

    function showError(message) {

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

    }


    function hideError() {

      errorBox.style.display =
        "none";

    }

  </script>

</body>
</html>
